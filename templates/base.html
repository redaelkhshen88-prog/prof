{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}مسيو رضا الخشن{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body>
<header><div class="bar"><a href="{% url 'home' %}"><b>M. Reda Elkhshen</b><br><small class="sub">مسيو رضا الخشن</small></a>
<nav><a href="{% url 'plans' %}">الاشتراكات</a>
{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">لوحتي</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn gh">خروج</button></form>
{% else %}<a href="{% url 'login' %}">دخول</a><a class="btn" href="{% url 'signup' %}">أنشئ حسابك</a>{% endif %}</nav></div></header>
<main class="wrap">{% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
